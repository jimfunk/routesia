syntax = "proto3";

package routesia.interface;

// Interface type
//
enum InterfaceType {
  UNDEFINED = 0;
  LOOPBACK = 1;
  ETHERNET = 2;
  BRIDGE = 3;
  VLAN = 4;
  SIT = 5;
  VXLAN = 6;
  PPPOE = 7;
}

// Address families negotiated over PPP
//
enum AddressMode {
  ANY = 0;
  IPV4 = 1;
  IPV6 = 2;
  NONE = 3;
}

message InterfaceLink {
  // Link up/down
  //
  bool up = 1;

  // Don't accept ARP
  //
  bool noarp = 2;

  // Transmit queue length
  //
  uint32 txqueuelen = 3;

  // Maximum transmission unit
  //
  uint32 mtu = 4;

  // Link layer address
  //
  string address = 5;

  // Link layer broadcast address
  //
  string broadcast = 6;

  // Master device for interface (bridge, bond, etc.)
  //
  string master = 7;

  // IPv6 address generation mode
  //
  enum AddrGenMode {
    EUI64 = 0;
    NONE = 1;
    STABLE_PRIVACY = 2;
    RANDOM = 3;
  }
  AddrGenMode addrgenmode = 8;

  // IPv6 address token
  //
  string token = 9;
}

// TCP MSS clamping
//
message MSSClamp {
  enum Family {
    ALL = 0;
    IPV4 = 1;
    IPV6 = 2;
  }

  // Path MTU in bytes. The TCP MSS is derived from it.
  //
  uint32 mtu = 1;

  // Address family to clamp
  //
  Family family = 2;
}

// Bridge configuration
//
message BridgeInterfaceConfig {
  // Ageing time
  //
  uint32 ageing_time = 1;

  // Forward delay
  //
  uint32 forward_delay = 2;

  // Hello time
  //
  uint32 hello_time = 3;

  // Max age
  //
  uint32 max_age = 4;

  // Spanning tree protocol (STP)
  //
  bool stp = 5;

  // STP priority (Actually u16)
  //
  int32 priority = 6;

  // VLAN filtering
  //
  bool vlan_filtering = 7;

  // Default PVID of any new ports
  //
  int32 default_pvid = 8;
}

// VLAN configuration
//
message VLANInterfaceConfig {
  // Trunk interface
  //
  string trunk = 1;

  // VLAN ID
  //
  uint32 id = 2;

  // Group VLAN Registration Protocol (GVRP)
  //
  bool gvrp = 3;

  // Multiple VLAN Registration Protocol (MVRP)
  //
  bool mvrp = 4;
}


// SIT configuration
//
message SITInterfaceConfig {
    // Remote address
    //
    string remote = 1;

    // Local address
    //
    string local = 2;

    // TTL
    //
    uint32 ttl = 3;
}

// VXLAN endpoint configuration
//
message VXLANEndpointConfig {
    // Remote address
    //
    string remote = 1;

    // Remote port
    //
    uint32 port = 2;

    // Remote VNI
    //
    uint32 vni = 3;
}

// VXLAN configuration
//
message VXLANInterfaceConfig {
    // Port
    //
    uint32 port = 1;

    // Multicast group address
    //
    string group = 2;

    // Remote address
    //
    string remote = 3;

    // Local address
    //
    string local = 4;

    // Interface
    //
    string interface = 5;

    // TTL
    //
    uint32 ttl = 6;

    // VNI
    //
    uint32 vni = 7;

    // Endpoints
    //
    repeated VXLANEndpointConfig endpoint = 9;
}

// PPPoE configuration
//
message PPPoEInterfaceConfig {
  // Interface identifier generation for IPv6CP
  //
  enum IPv6CPInterfaceID {
    RANDOM = 0;
    IPV4 = 1;
    PERSISTENT = 2;
  }

  // Ethernet underlay interface
  //
  string interface = 1;

  // Credentials for the peer
  //
  string username = 2;
  string password = 3;

  // PPPoE service name
  //
  string service = 4;

  // Access concentrator name
  //
  string ac = 5;

  // Link MTU. Must allow for the PPPoE header, so 1492 unless the underlay
  // supports baby jumbo frames
  //
  uint32 mtu = 6;

  // Link MRU
  //
  uint32 mru = 7;

  // Seconds between LCP echo requests
  //
  uint32 lcp_echo_interval = 8;

  // Missed LCP echo requests before the link is dropped
  //
  uint32 lcp_echo_failure = 9;

  // Routing table for peer-supplied default routes
  //
  uint32 table = 10;

  // Address families to take from the peer
  //
  AddressMode address_mode = 11;

  // Interface identifier generation for IPv6CP
  //
  IPv6CPInterfaceID ipv6_interface_id = 12;
}

// PPPoE session state
//
message PPPoEStatus {
  // Local IPv4 address
  //
  string local_address = 1;

  // Peer IPv4 address
  //
  string peer_address = 2;

  // Local IPv6 link-local address
  //
  string local_ipv6_address = 3;

  // Peer IPv6 link-local address
  //
  string peer_ipv6_address = 4;

  // Access concentrator name
  //
  string ac_name = 5;

  // Access concentrator MAC address
  //
  string remote_mac = 6;
}

// Event sent by the pppd hook scripts
//
message PPPoEInterfaceEvent {
  enum Type {
    UNDEFINED = 0;
    IPV4_UP = 1;
    IPV4_DOWN = 2;
    IPV6_UP = 3;
    IPV6_DOWN = 4;
  }

  // Interface name
  //
  string interface = 1;

  // Event type
  //
  Type type = 2;

  // Local IPv4 address
  //
  string local_address = 3;

  // Peer IPv4 address
  //
  string peer_address = 4;

  // Local IPv6 link-local address
  //
  string local_ipv6_address = 5;

  // Peer IPv6 link-local address
  //
  string peer_ipv6_address = 6;

  // Access concentrator name
  //
  string ac_name = 7;

  // Access concentrator MAC address
  //
  string remote_mac = 8;
}

// Interface module config
//
message InterfaceConfig {
  // Name
  //
  string name = 1;

  // Interface type
  //
  InterfaceType type = 2;

  // Link config parameters
  //
  InterfaceLink link = 3;

  // TCP MSS clamp for packets leaving this interface
  //
  MSSClamp mss_clamp = 4;

  // Type-specific options
  //
  BridgeInterfaceConfig bridge = 100;
  VLANInterfaceConfig vlan = 101;
  SITInterfaceConfig sit = 102;
  VXLANInterfaceConfig vxlan = 103;
  PPPoEInterfaceConfig pppoe = 104;
}

// List of interface configurations
//
message InterfaceConfigList { repeated InterfaceConfig interface = 1; }

// Represents an interface entity
//
message Interface {
  // Interface name
  //
  string name = 1;

  // Link parameters
  //
  InterfaceLink link = 2;

  // Interface config, if present
  //
  InterfaceConfig config = 3;

  // PPPoE session state, if this is a PPPoE interface
  //
  PPPoEStatus pppoe = 4;
}

// A list of interface entities
//
message InterfaceList { repeated Interface interface = 1; }
